version: '3.8'

services:
  career-ai-hub:
    build: .
    image: career-ai-hub
    container_name: career-ai-hub
    restart: unless-stopped
    ports:
      # Exposes the container's port 80 to the host's port 8081.
      # Nginx Proxy Manager (NPM) should forward traffic to 127.0.0.1:8081
      - "127.0.0.1:8081:80"
    networks:
      - npm_net

networks:
  npm_net:
    external: true
