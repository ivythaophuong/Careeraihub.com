server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # /singapore -> /singapore/ must stay a relative redirect: behind the proxy this server only sees http on its own port.
    absolute_redirect off;

    # The app lives at "/" only (it switches modules with ?tab=, see src/App.jsx). Any other path that is not
    # a real file gets a real 404, so crawlers do not index junk URLs as copies of the home page.
    # nginx does not inherit server-level add_header into a location that sets its own,
    # so the security headers are repeated in each location, next to Cache-Control.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite output: file names contain a content hash, so they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
