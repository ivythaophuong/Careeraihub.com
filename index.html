<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <title>CareerAiHub — AI Career Acceleration Platform</title>
  <meta name="google-site-verification" content="I_1n-g-cR9tJgqd0d6FVtaz3ONfI3JBEvVjSBjp1yuE" />
  <meta name="description" content="CareerAiHub scans your resume like a senior hiring manager, identifies exactly what's costing you interviews, then coaches you from first application to signed offer."/>
  <meta name="keywords" content="AI resume scanner, career coaching, interview preparation, job search, salary negotiation, ATS optimization"/>
  <meta property="og:title" content="CareerAiHub — Your resume has blind spots. AI finds them in 20 seconds."/>
  <meta property="og:description" content="10 AI modules. One connected system. Resume scan, mock interviews, salary coach, cover letter, and AI memory that gets smarter every session."/>

  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#090C12;color:#E8F0FE;font-family:'Inter',sans-serif;min-height:100vh}
    #root{min-height:100vh}
    #boot{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;min-height:100vh;background:#090C12}
    .boot-logo{font-family:'Outfit',sans-serif;font-size:22px;color:#E8F0FE;display:flex;align-items:center;gap:10px}
    .boot-dot{width:8px;height:8px;border-radius:50%;background:#00D4FF;box-shadow:0 0 10px #00D4FF;animation:pulse 2s ease infinite}
    .boot-spinner{width:32px;height:32px;border:2px solid #1E2D45;border-top-color:#00D4FF;border-radius:50%;animation:spin .8s linear infinite}
    .boot-msg{font-size:12px;color:#6B7E9F;letter-spacing:.08em}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
